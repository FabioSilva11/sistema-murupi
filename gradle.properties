# Project-wide Gradle settings.
# Ajustado para PC com pouca memória (4 GB de RAM): heap pequeno, sem builds paralelos,
# um worker só e o compilador Kotlin rodando dentro do processo do Gradle (sem daemon extra).
# TieredStopAtLevel=1 usa só o JIT C1, que consome bem menos memória nativa que o C2.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
# AndroidX package structure
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies.
android.nonTransitiveRClass=true
